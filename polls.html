<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polls · Hawthorne-Scribner High School</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand-row">
      <a class="brand" href="index.html"><img class="badge" src="images/badge.png" alt="Hawthorne-Scribner High School badge"><div class="nameplate"><strong>Hawthorne-Scribner</strong><span>High School · Bududa</span></div></a>
      <button class="nav-btn menu-toggle" data-menu type="button">Menu</button>
    </div>
    <div class="nav-wrap"><nav class="nav" aria-label="Primary"></nav></div>
  </header>
  <main class="page">
    <section class="hero-copy">
      <div class="kicker">Polls</div>
      <h2>School vote</h2>
      <p>Pick one. Your choice stays on this device.</p>
    </section>
    <section class="grid cols-2" id="poll">
      <button class="btn" type="button" data-choice="Sports day">Sports day</button>
      <button class="btn" type="button" data-choice="Music concert">Music concert</button>
      <button class="btn" type="button" data-choice="Science fair">Science fair</button>
      <button class="btn" type="button" data-choice="Reading week">Reading week</button>
    </section>
    <p id="poll-result" class="tiny"></p>
  </main>
</div>
<script>
(function () {
  var key = "hshs-poll";
  var votes = JSON.parse(localStorage.getItem(key) || "{}");
  var result = document.getElementById("poll-result");
  function draw() {
    var bits = Object.keys(votes).map(function (name) { return name + ": " + votes[name]; });
    result.textContent = bits.length ? bits.join(" · ") : "No votes yet.";
  }
  document.getElementById("poll").addEventListener("click", function (event) {
    var btn = event.target.closest("[data-choice]");
    if (!btn) return;
    votes[btn.dataset.choice] = (votes[btn.dataset.choice] || 0) + 1;
    localStorage.setItem(key, JSON.stringify(votes));
    draw();
  });
  draw();
})();
</script>
<script src="js/app.js"></script>
</body>
</html>
